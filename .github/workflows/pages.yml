name: pages

# Build the Clerk notebook and deploy it to GitHub Pages on every master push. All correctness gates —
# offline suite, Frink oracle, docs render, and the live integration tests — live in ci.yml (which also
# runs on master push); the release + Clojars publish is ci.yml's `release` job. CPI is in monthly.yml.
on:
  push:
    branches: [master]
  workflow_dispatch:        # allow a manual run (e.g. to re-publish the docs)

# Serialize Pages deploys (one at a time).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-docs:
    name: deploy-docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clojure
      - name: Build docs (live)
        env:
          CURRENCYFREAKS_API_KEY: ${{ secrets.CURRENCYFREAKS_API_KEY }}
        run: clojure -X:build docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc
      - uses: actions/deploy-pages@v4
        id: deployment
