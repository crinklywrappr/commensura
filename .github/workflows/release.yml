name: release

# Continuous deployment. When CI is fully green on a master push — offline suite, Frink oracle, docs, and
# the live integration tests (all in ci.yml) — publish com.github.crinklywrappr/commensura to Clojars and
# cut a GitHub release. The tag v1.0.<git-count-revs> is the idempotency marker: it is created only AFTER
# a successful Clojars publish, so a re-run never double-publishes, and a failed publish (no tag) is
# retried on the next trigger.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:        # manually release current master HEAD (also bootstraps the first run)

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write           # create the git tag + GitHub release (tags are not branch-protected)

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    # Only on a *successful* CI run for a master *push* (never PRs or failed CI) — or a manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit CI validated (workflow_run), or master HEAD on a manual dispatch.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0    # full history so `git rev-list --count` matches build.clj's version
      - uses: ./.github/actions/clojure
      - name: Compute the version; skip if already released
        id: ver
        run: |
          version="1.0.$(git rev-list --count HEAD)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v${version} is already released — nothing to do."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Releasing v${version}."
          fi
      - name: Build the JAR
        if: steps.ver.outputs.released == 'false'
        run: clojure -X:build jar
      - name: Publish to Clojars
        if: steps.ver.outputs.released == 'false'
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -X:build deploy
      - name: Tag + GitHub release (only after a successful publish)
        if: steps.ver.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            --target "$(git rev-parse HEAD)" \
            --title  "v${{ steps.ver.outputs.version }}" \
            --generate-notes
