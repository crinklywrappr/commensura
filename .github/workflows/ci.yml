name: CI

# Gates run on EVERY pull request, into any branch (the ruleset requires `test` / `oracle` / `docs`).
# For `pull_request`, GitHub runs the workflow file from the PR's own branch and matches any `branches:`
# filter against the *base* (target) branch — so leaving `pull_request` unfiltered covers PRs into feature
# / integration branches too, not just master. `push` stays master-only: it runs there so the badge
# reflects the default branch and the *merged* result is verified — not just the pre-merge PR. On a master
# push (or dispatch), once the suite is green, `release` publishes to Clojars + cuts the tag and
# `deploy-docs` publishes the notebook to Pages — CD in the same run, visible on the commit. live /
# release / deploy-docs are gated on `github.ref == 'refs/heads/master'` (a PR's ref is refs/pull/N/merge),
# so a PR run executes only the test / oracle / docs gates.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clojure
      - name: Offline test suite
        run: clojure -X:build test

  oracle:
    name: oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clojure
      - name: Provide frink.jar for the oracle
        env:
          FRINK_REPO_TOKEN: ${{ secrets.FRINK_REPO_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${FRINK_REPO_TOKEN}@github.com/crinklywrappr/frink.git" \
            "${RUNNER_TEMP}/frink"
          # the :frink alias resolves :local/root "frink.jar" in the project root (gitignored by *.jar)
          cp "${RUNNER_TEMP}/frink/frink.jar" "${GITHUB_WORKSPACE}/frink.jar"
      # No FRED/CurrencyFreaks keys here on purpose: the Frink oracle only covers units + dimensional
      # arithmetic, and the ^:live tests self-skip without keys — so PRs never spend live API quota.
      - name: Full suite + Frink oracle
        run: clojure -X:build test-oracle

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clojure
      - name: Build the Clerk notebook (verify it renders; no key → live cells degrade gracefully)
        run: clojure -X:build docs

  # Live integration tests (real FRED + CurrencyFreaks). Runs on master whether reached by push OR manual
  # dispatch — only PRs skip it, so PRs never spend API quota (the ^:live tests also self-skip without
  # keys). The `release` job `needs` this, so nothing publishes unless live is green. (PR events have ref
  # refs/pull/N/merge, so this correctly excludes them.)
  live:
    name: live
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clojure
      - name: Live integration tests (FRED + CurrencyFreaks)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CURRENCYFREAKS_API_KEY: ${{ secrets.CURRENCYFREAKS_API_KEY }}
        run: clojure -X:build test    # the ^:live tests run themselves when the keys are present

  # Continuous deployment: on green master (push or dispatch), publish com.github.crinklywrappr/commensura
  # to Clojars and cut a GitHub release. `needs` every other job, so a red suite publishes nothing. Living
  # in this push-triggered workflow (rather than a separate workflow_run one) keeps it visible on the commit
  # as `CI / release`. The tag v1.0.<git-count-revs> is written only after a successful publish, so it is
  # the idempotency marker: a re-run skips, and a failed publish (no tag) retries on the next trigger.
  release:
    name: release
    needs: [test, oracle, docs, live]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the git tag + GitHub release (tags are not branch-protected)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history so `git rev-list --count` matches build.clj's version
      - uses: ./.github/actions/clojure
      - name: Compute the version; skip if already released
        id: ver
        run: |
          version="1.0.$(git rev-list --count HEAD)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v${version} is already released — nothing to do."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Releasing v${version}."
          fi
      - name: Build the JAR
        if: steps.ver.outputs.released == 'false'
        run: clojure -X:build jar
      - name: Publish to Clojars
        if: steps.ver.outputs.released == 'false'
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -X:build deploy
      - name: Tag + GitHub release (only after a successful publish)
        if: steps.ver.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            --target "$(git rev-parse HEAD)" \
            --title  "v${{ steps.ver.outputs.version }}" \
            --generate-notes

  # Publish the Clerk notebook to GitHub Pages — only on green master, gated on the build jobs so a red
  # suite never republishes the docs. Its own `pages` concurrency serializes deploys without touching the
  # rest of CI. Not gated on `live`: the notebook's live cells degrade gracefully, so an API blip
  # shouldn't block a docs update.
  deploy-docs:
    name: deploy-docs
    needs: [test, oracle, docs]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clojure
      - name: Build docs (live)
        env:
          CURRENCYFREAKS_API_KEY: ${{ secrets.CURRENCYFREAKS_API_KEY }}
        run: clojure -X:build docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc
      - uses: actions/deploy-pages@v4
        id: deployment
