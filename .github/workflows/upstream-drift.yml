name: upstream-drift

# A maintenance signal, decoupled from PRs/releases: has Frink's upstream units.txt moved past the
# copy we pinned in dev-resources/? If so, open an issue so a maintainer can re-pin and regenerate.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare upstream units.txt to the pinned copy
        id: drift
        run: |
          curl -fsSL https://frinklang.org/frinkdata/units.txt -o /tmp/units-upstream.txt
          if diff -q dev-resources/frink/units.txt /tmp/units-upstream.txt >/dev/null; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open an issue if it drifted (deduped by title)
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream units.txt has drifted"
          open=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq 'length')
          if [ "${open}" -gt 0 ]; then
            echo "An open drift issue already exists — not filing a duplicate."
            exit 0
          fi
          gh issue create --title "${title}" --body \
          "Frink's upstream \`units.txt\` (https://frinklang.org/frinkdata/units.txt) now differs from the pinned \`dev-resources/frink/units.txt\`.

          To update:
          1. Re-pin \`dev-resources/frink/units.txt\`.
          2. \`clojure -X:build convert && clojure -X:build gen-units\`.
          3. \`clojure -X:build test\`; if the drift test flags a nonlinear function, follow CONTRIBUTING.md.

          Filed automatically by the \`upstream-drift\` workflow."
