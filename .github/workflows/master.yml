name: master

# Post-merge side effects: run the live integration tests and publish the docs.
# (Tests + oracle already gated the PR; see ci.yml. CPI refresh lives in monthly.yml.)
on:
  push:
    branches: [master]
  workflow_dispatch:        # allow a manual run (e.g. to re-publish the docs)

# Serialize master runs (one Pages deploy at a time).
concurrency:
  group: master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    name: live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clojure
      - name: Live integration tests (FRED + CurrencyFreaks)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CURRENCYFREAKS_API_KEY: ${{ secrets.CURRENCYFREAKS_API_KEY }}
        run: clojure -X:build test    # the ^:live tests run themselves when the keys are present

  deploy-docs:
    name: deploy-docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clojure
      - name: Build docs (live)
        env:
          CURRENCYFREAKS_API_KEY: ${{ secrets.CURRENCYFREAKS_API_KEY }}
        run: clojure -X:build docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc
      - uses: actions/deploy-pages@v4
        id: deployment
