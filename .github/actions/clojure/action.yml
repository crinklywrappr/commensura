name: Clojure toolchain
description: Java (Temurin) + Clojure CLI + a cached ~/.m2 / ~/.gitlibs. Assumes the repo is already checked out.

inputs:
  cache-suffix:
    description: >
      Appended to the cache-key prefix, to give a workflow its own cache namespace. Leave empty (CI) to
      share the cache the CI `setup` job seeds *complete* (incl. :clerk). A workflow that never fetches
      :clerk (e.g. monthly) should pass a suffix so it can't seed a Clerk-less entry under CI's key — a
      cache entry is immutable, so CI's docs could never complete it.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
    - uses: DeLaGuardo/setup-clojure@13.4
      with:
        cli: latest
    - uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
          ~/.deps.clj
        # `-v2-` abandons pre-`setup`-job caches, which a non-Clerk job may have saved *without* the
        # :clerk deps (a cache entry is immutable, so that partial could never gain them). With the CI
        # `setup` job now seeding the cache first — and non-Clerk workflows on their own `cache-suffix`
        # namespace — every entry under CI's key is complete.
        key: ${{ runner.os }}-clj-v2${{ inputs.cache-suffix }}-${{ hashFiles('deps.edn') }}
        restore-keys: ${{ runner.os }}-clj-v2${{ inputs.cache-suffix }}-
