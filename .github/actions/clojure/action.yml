name: Clojure toolchain
description: Java (Temurin) + Clojure CLI + a cached ~/.m2 / ~/.gitlibs. Assumes the repo is already checked out.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
    - uses: DeLaGuardo/setup-clojure@13.4
      with:
        cli: latest
    - uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
          ~/.deps.clj
        # `-v2-` abandons pre-`setup`-job caches, which a non-Clerk job may have saved *without* the
        # :clerk deps (a cache entry is immutable, so that partial could never gain them). With the CI
        # `setup` job now seeding the cache first, every entry from here on is complete.
        key: ${{ runner.os }}-clj-v2-${{ hashFiles('deps.edn') }}
        restore-keys: ${{ runner.os }}-clj-v2-
